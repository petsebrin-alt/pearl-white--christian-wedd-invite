<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script>
    // On a phone or tablet, open the invitation itself, full screen — not a
    // picture of a phone inside the phone. The guest's name in the link is kept.
    (function () {
      var mq = window.matchMedia && window.matchMedia('(max-width: 760px), (pointer: coarse) and (max-width: 1180px)');
      if (!mq || !mq.matches) return;
      var q = new URLSearchParams(location.search);
      q.delete('section'); q.delete('live');
      var s = q.toString();
      location.replace('index.html' + (s ? '?' + s : '') + location.hash);
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Angel &amp; David · Invitation on iPhone</title>
  <meta name="description" content="Angel and David's wedding invitation running live inside an iPhone 17 Pro Max.">

    html, body { height: 100%; overflow: hidden; }

  </style>
</head>
<body>

          <div class="device__screen">

              <span>9:41</span>
              <span class="statusbar__icons">
                <svg viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1" fill="#111"/><rect x="5" y="5.5" width="3" height="6.5" rx="1" fill="#111"/><rect x="10" y="3" width="3" height="9" rx="1" fill="#111"/><rect x="15" y="0" width="3" height="12" rx="1" fill="#111"/></svg>
                <svg viewBox="0 0 16 12"><path d="M8 11.2l2.3-2.6a3.3 3.3 0 0 0-4.6 0z" fill="#111"/><path d="M3.6 6.3a6.2 6.2 0 0 1 8.8 0l1.4-1.6a8.3 8.3 0 0 0-11.6 0z" fill="#111"/><path d="M.6 3a10.6 10.6 0 0 1 14.8 0L16 2.3l-.1-.1a11.7 11.7 0 0 0-15.8 0L0 2.3z" fill="#111"/></svg>
                <svg viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.6" fill="none" stroke="#111" stroke-opacity=".4"/><rect x="2" y="2" width="20" height="9" rx="2.2" fill="#111"/><path d="M25 4.5v4c.8-.3 1.4-1.1 1.4-2s-.6-1.7-1.4-2z" fill="#111" fill-opacity=".4"/></svg>

  <script>
    (function () {
      var device = document.getElementById('device');
      var frame = document.querySelector('.screen-frame');

      // The phone shows the live invitation: index.html from this same
      // deployment (never a copy), and Vercel serves every file with
      // "max-age=0, must-revalidate" (vercel.json). So whatever is pushed to
      // GitHub appears in this phone as soon as Vercel finishes deploying.

      // Optional: open the phone on one section, at rest (used for the
      // section images): mockup.html?section=rsvp, ?section=end (the parked
      // car) or ?section=names (the names screen after the opening).
      var sec = (location.search.match(/[?&]section=([a-z-]+)/) || [])[1];
      var page = !sec ? 'index.html' : sec === 'names' ? 'index.html?still'
        : sec === 'end' ? 'index.html?still&end' : 'index.html?still#' + sec;
      // A one-off marker in the address makes every visit fetch index.html
      // afresh, even from a host that sends no caching rules.
      frame.src = page.replace(/(#.*)?$/, function (hash) {
        return (page.indexOf('?') > -1 ? '&' : '?') + 'live=' + Date.now() + hash;
      });

      // Coming back with the browser's Back button can restore this page from
      // memory with an old invitation inside; load the latest one instead.
      window.addEventListener('pageshow', function (e) {
        if (!e.persisted) return;
        try { frame.contentWindow.location.reload(); } catch (err) { frame.src = frame.getAttribute('src'); }
      });
      var wrap = document.getElementById('device-wrap');
      var DW = 440 + 32, DH = 956 + 32;   // phone incl. bezel and band

      // Scale the phone to fit the window, centred; the screen keeps its real
      // iPhone 17 Pro Max size so the invitation lays out exactly as on the device.
      function fit() {
        var vw = document.documentElement.clientWidth, vh = window.innerHeight;
        var s = Math.max(0.3, Math.min(1, (vh - 48) / DH, (vw - 32) / DW));
        device.style.setProperty('--s', s);
        wrap.style.width = Math.round(DW * s) + 'px';
        wrap.style.height = Math.round(DH * s) + 'px';
      }
      window.addEventListener('resize', fit);
      fit();
    })();
  </script>
</body>
</html>
